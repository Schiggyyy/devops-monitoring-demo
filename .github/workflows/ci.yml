name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Tests ausfuehren
        run: pytest -v

  build-and-push:
    name: Build & Push Images zu ACR
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Bei ACR einloggen
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

- name: api-service bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: ./api-service
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/api-service:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/api-service:${{ github.sha }}

      - name: collector-service bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: ./collector-service
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/collector-service:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/collector-service:${{ github.sha }}

      - name: processing-service bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: ./processing-service
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/processing-service:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/processing-service:${{ github.sha }}

      - name: frontend-service bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: ./frontend-service
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/frontend-service:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/frontend-service:${{ github.sha }}