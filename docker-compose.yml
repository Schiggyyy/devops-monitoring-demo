services:
  database:
    image: postgres:16
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: monitoring
    ports:
      - "5432:5432"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d monitoring"]
      interval: 10s
      timeout: 5s
      retries: 5

  collector-service:
    build: ./collector-service
    depends_on:
      - database

  processing-service:
    build: ./processing-service
    depends_on:
      - database
    environment:
      DB_HOST: database
      DB_NAME: monitoring
      DB_USER: demo
      DB_PASSWORD: demo
    restart: unless-stopped

  api-service:
    build: ./api-service
    ports:
      - "8000:8000"
    depends_on:
      - database
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend-service:
    build: ./frontend-service
    ports:
      - "3000:80"
    depends_on:
      api-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 5