services:
  database:
    image: postgres:16
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: monitoring
    ports:
      - "5432:5432"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  collector-service:
    build: ./collector-service
    depends_on:
      - database

  api-service:
    build: ./api-service
    ports:
      - "8000:8000"
    depends_on:
      - database